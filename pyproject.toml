[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "papermerge-upload-demo"
version = "0.1.0"
description = "Local upload demo for Papermerge Core 3.5.3"
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["dependencies"]

[tool.setuptools]
py-modules = ["demo"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
